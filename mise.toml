[tasks.dev]
description = 'Bundle the spa on every source change and serve it with live reload'
depends = ['dev-watch', 'dev-serve']

[tasks.dev-watch]
description = 'Re-bundle the spa when purs/js sources change'
depends = ['bundle-spa']
# --postpone: the initial bundle is already produced by the bundle-spa dependency
run = 'watchexec --postpone -e purs,js -w packages -i output mise run bundle-spa'

[tasks.dev-serve]
description = 'Serve the spa through parcel; reloads the browser when the bundle changes'
depends = ['bundle-spa']
# mise pipes task output (for the [dev-serve] prefix), so parcel can't read the terminal size from stdout.
# Without COLUMNS/LINES its term-size dependency falls back to `resize`, which hangs on a real tty.
env = { COLUMNS = '120', LINES = '40' }
run = 'parcel serve packages/spa/index.html'

[tasks.bundle-spa]
run = 'spago bundle -p spa --platform browser --bundle-type app --module Spa.Main'

[tasks.build]
run = 'spago build'

[tasks.build-spa]
run = 'spago bundle --platform browser --bundle-type app --minify -p spa --module Spa.Main'

[tasks.docs]
run = 'spago docs'

[tasks.clean]
run = 'rm -rf output index.js'

[tasks.format]
run = 'purs-tidy format-in-place packages/**/*.purs'

[env]
_.path = './node_modules/.bin'

[tools]
node = "24.18"
pitchfork = "latest"
"npm:spago" = "latest"
purescript = "latest"
"npm:esbuild" = { version = "latest", allow_builds = ["esbuild"] }
"npm:purs-tidy" = "latest"

[tools."npm:purescript-language-server"]
version = "latest"

[tools."npm:parcel"]
version = "latest"

